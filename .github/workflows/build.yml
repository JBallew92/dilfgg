name: Build check

# Tests and builds every pull request and branch push so broken changes are
# caught before they reach main. Deploying is done by deploy.yml.

on:
  push:
    branches-ignore: [gh-pages, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # CI=false keeps lint warnings as warnings, matching local builds.
      - run: npm run build
        env:
          CI: false
